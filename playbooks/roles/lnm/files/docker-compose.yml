services:
  grafana:
    image: grafana/grafana-oss
    user: "0"
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
     - '3000:3000'
    volumes:
      - /home/ansible-user/lnm/grafana:/var/lib/grafana
      - /home/ansible-user/lnm/grafana-provisioning:/etc/grafana/provisioning
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.prithvirajchaudhuri.com`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.service=grafana"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=cloudflare"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  grafana-mcp:
    image: grafana/mcp-grafana:latest
    container_name: grafana-mcp
    restart: unless-stopped
    env_file:
      - .env
    command:
      - --transport
      - streamable-http
      - --address
      - 0.0.0.0:8000
      - --metrics
      - --metrics-address
      - 0.0.0.0:9090
      - --healthz-address
      - 0.0.0.0:9090
      - --disable-write
      - --allowed-hosts
      - grafana.mcp.prithvirajchaudhuri.com
    depends_on:
      - grafana
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana-mcp.rule=Host(`grafana.mcp.prithvirajchaudhuri.com`)"
      - "traefik.http.routers.grafana-mcp.entrypoints=websecure"
      - "traefik.http.routers.grafana-mcp.service=grafana-mcp"
      - "traefik.http.routers.grafana-mcp.tls=true"
      - "traefik.http.routers.grafana-mcp.tls.certresolver=cloudflare"
      - "traefik.http.services.grafana-mcp.loadbalancer.server.port=8000"
      - "traefik.http.routers.grafana-mcp-health.rule=Host(`grafana.mcp.prithvirajchaudhuri.com`) && Path(`/healthz`)"
      - "traefik.http.routers.grafana-mcp-health.entrypoints=websecure"
      - "traefik.http.routers.grafana-mcp-health.priority=100"
      - "traefik.http.routers.grafana-mcp-health.service=grafana-mcp-health"
      - "traefik.http.routers.grafana-mcp-health.tls=true"
      - "traefik.http.routers.grafana-mcp-health.tls.certresolver=cloudflare"
      - "traefik.http.services.grafana-mcp-health.loadbalancer.server.port=9090"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    depends_on:
      - blackbox-exporter
    volumes:
      - /home/ansible-user/lnm/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - traefik

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    volumes:
      - /home/ansible-user/lnm/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml
    networks:
      - traefik

  # Exposes per-container CPU/memory metrics for the containers managed via Portainer
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - traefik

networks:
  traefik:
    external: true

volumes:
  prometheus_data: