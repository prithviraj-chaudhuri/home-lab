global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Probes every hostname served through the Cloudflare/Traefik ingress
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://adminer.prithvirajchaudhuri.com
          - https://chat.prithvirajchaudhuri.com
          - https://filebrowser.prithvirajchaudhuri.com
          - https://grafana.prithvirajchaudhuri.com
          - https://homepage.prithvirajchaudhuri.com
          - https://langfuse.prithvirajchaudhuri.com
          - https://mongo.prithvirajchaudhuri.com
          - https://n8n.prithvirajchaudhuri.com
          - https://ollama.prithvirajchaudhuri.com
          - https://pgadmin.prithvirajchaudhuri.com
          - https://portainer.prithvirajchaudhuri.com
          - https://postgres-mcp.prithvirajchaudhuri.com
          - https://qdrant.prithvirajchaudhuri.com
          - https://traefik.prithvirajchaudhuri.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
