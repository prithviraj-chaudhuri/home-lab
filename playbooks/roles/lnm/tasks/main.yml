- name: Create lnm config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - /home/ansible-user/lnm/prometheus
    - /home/ansible-user/lnm/blackbox
    - /home/ansible-user/lnm/grafana-provisioning/datasources
    - /home/ansible-user/lnm/grafana-provisioning/dashboards/json
    - /home/ansible-user/lnm/secrets

- name: Copy grafana docker-compose.yml
  copy: 
    src: "{{ item }}"
    dest: /home/ansible-user/lnm/
  loop:
    - docker-compose.yml

- name: Check Grafana MCP environment exists on the controller
  ansible.builtin.stat:
    path: "{{ role_path }}/files/secrets/.env"
  delegate_to: localhost
  become: false
  register: grafana_mcp_env

- name: Require Grafana MCP environment
  ansible.builtin.assert:
    that:
      - grafana_mcp_env.stat.exists
      - grafana_mcp_env.stat.isreg
    fail_msg: >-
      Create {{ role_path }}/files/secrets/.env from grafana-mcp.env.example
      with a Grafana service-account token and MCP caller token before running
      the lnm tag.

- name: Copy Grafana MCP environment
  copy:
    src: secrets/.env
    dest: /home/ansible-user/lnm/.env
    mode: '0600'

- name: Require Cloudflare zone domain
  ansible.builtin.assert:
    that:
      - cloudflare_zone_domain is defined
      - cloudflare_zone_domain | length > 0
    fail_msg: >-
      CLOUDFLARE_ZONE environment variable is not set. Blackbox probe targets
      would be rendered as "https://<record>." without a domain, producing
      misconfigured endpoints. Export CLOUDFLARE_ZONE before running the lnm
      tag.

- name: Render prometheus config
  ansible.builtin.template:
    src: prometheus/prometheus.yml.j2
    dest: /home/ansible-user/lnm/prometheus/prometheus.yml

- name: Copy blackbox exporter config
  copy:
    src: blackbox/blackbox.yml
    dest: /home/ansible-user/lnm/blackbox/blackbox.yml

- name: Copy grafana datasource provisioning
  copy:
    src: grafana-provisioning/datasources/datasource.yml
    dest: /home/ansible-user/lnm/grafana-provisioning/datasources/datasource.yml

- name: Copy grafana dashboard provisioning
  copy:
    src: grafana-provisioning/dashboards/dashboard.yml
    dest: /home/ansible-user/lnm/grafana-provisioning/dashboards/dashboard.yml

- name: Copy grafana dashboard definitions
  copy:
    src: "grafana-provisioning/dashboards/json/{{ item }}"
    dest: "/home/ansible-user/lnm/grafana-provisioning/dashboards/json/{{ item }}"
  loop:
    - blackbox-exporter.json
    - container-metrics.json
    - mcp-grafana.json

- name: Restart lnm service
  include_role:
    name: restart-service
  vars:
    service_name: "lnm"