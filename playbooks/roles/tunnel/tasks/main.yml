---
- name: Ensure /etc/ssh directory exists
  file:
    path: /etc/ssh
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Cloudflare CA public key
  copy:
    src: secrets/ca.pub
    dest: /etc/ssh/ca.pub
    owner: root
    group: root
    mode: "0644"
    backup: yes
  notify: reload ssh

- name: Enable PubkeyAuthentication in sshd_config
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PubkeyAuthentication'
    line: 'PubkeyAuthentication yes'
    state: present
    backup: yes
  notify: reload ssh

- name: Set TrustedUserCAKeys in sshd_config
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?TrustedUserCAKeys'
    line: 'TrustedUserCAKeys /etc/ssh/ca.pub'
    state: present
    backup: yes
  notify: reload ssh

- name: Ensure sshd configuration drop-in directory exists
  file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Restrict SSH forwarding for ansible user
  copy:
    dest: /etc/ssh/sshd_config.d/ansible-user.conf
    content: |
      Match User ansible-user
          AllowTcpForwarding local
          PermitOpen 127.0.0.1:*
          X11Forwarding no
          AllowAgentForwarding no
    owner: root
    group: root
    mode: "0644"
  notify: reload ssh

- name: Copy tunnel files in
  copy: 
    src: "{{ item }}"
    dest: /home/ansible-user/tunnel/
  loop:
    - docker-compose.yml
    - secrets/.env

- name: Restart tunnel
  shell: cd tunnel && docker compose restart