---
# cloudflare-dns-data.yml - Data-driven DNS management
- name: Ensure Cloudflare DNS records are clean and recreated
  vars:
    cloudflare_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
    domain: "{{ lookup('env', 'CLOUDFLARE_ZONE') }}"
    cloudflare_ip: "{{ lookup('env', 'EQ01_IP_ADDRESS') }}"
    cloudflare_primary_records:
      - adminer
      - chat
      - eq01
      - filebrowser
      - grafana
      - homepage
      - langfuse
      - mongo1
      - mongo2
      - mongo3
      - mongo
      - n8n
      - ollama
      - pgadmin
      - portainer
      - postgres-mcp
      - qdrant
      - traefik
  block:
    - name: Query Cloudflare zone ID
      uri:
        url: "https://api.cloudflare.com/client/v4/zones?name={{ domain }}"
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: "application/json"
        return_content: yes
      register: cloudflare_zone_query
      failed_when: cloudflare_zone_query.status not in [200, 201] or
        (cloudflare_zone_query.json.success is defined and not cloudflare_zone_query.json.success)

    - name: Set Cloudflare zone ID
      set_fact:
        cloudflare_zone_id: "{{ cloudflare_zone_query.json.result[0].id }}"

    - name: Query existing Cloudflare A records for each primary name
      uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records?type=A&name={{ record_name }}.{{ domain }}"
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: "application/json"
        return_content: yes
      register: cloudflare_existing_records
      loop: "{{ cloudflare_primary_records | unique }}"
      loop_control:
        loop_var: record_name
        label: "{{ record_name }}"

    - name: Delete existing Cloudflare A records for duplicate names
      uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records/{{ item }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: "application/json"
        return_content: yes
      loop: "{{ cloudflare_existing_records.results | map(attribute='json.result') | flatten | map(attribute='id') | list }}"
      when: cloudflare_existing_records.results | map(attribute='json.result') | flatten | list | length > 0
      loop_control:
        label: "{{ item }}"

    - name: Create primary Cloudflare DNS records
      community.general.cloudflare_dns:
        zone: "{{ domain }}"
        record: "{{ item }}"
        type: A
        value: "{{ cloudflare_ip }}"
        proxied: false
        ttl: 1
        api_token: "{{ cloudflare_api_token }}"
        state: present
      loop: "{{ cloudflare_primary_records | unique }}"

- name: Create SSH Cloudflare tunnel DNS record
  community.general.cloudflare_dns:
    zone: "{{ lookup('env', 'CLOUDFLARE_ZONE') }}"
    record: ssh
    type: CNAME
    value: "{{ lookup('env', 'CLOUDFLARE_TUNNEL_ID') }}.cfargotunnel.com"
    proxied: true
    ttl: 1
    api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
    state: present
  delegate_to: localhost
  connection: local
  when:
    - lookup('env', 'CLOUDFLARE_API_TOKEN') | default('') | length > 0
    - lookup('env', 'CLOUDFLARE_ZONE') | default('') | length > 0
    - lookup('env', 'CLOUDFLARE_TUNNEL_ID') | default('') | length > 0

- name: Query Cloudflare tunnel configuration
  uri:
    url: "https://api.cloudflare.com/client/v4/accounts/{{ cloudflare_account_id }}/cfd_tunnel/{{ cloudflare_tunnel_id }}/configurations"
    method: GET
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: "application/json"
    return_content: yes
  vars:
    cloudflare_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
    cloudflare_account_id: "{{ lookup('env', 'CLOUDFLARE_ACCOUNT_ID') }}"
    cloudflare_tunnel_id: "{{ lookup('env', 'CLOUDFLARE_TUNNEL_ID') }}"
  delegate_to: localhost
  connection: local
  register: cloudflare_tunnel_configuration
  when:
    - lookup('env', 'CLOUDFLARE_API_TOKEN') | default('') | length > 0
    - lookup('env', 'CLOUDFLARE_ACCOUNT_ID') | default('') | length > 0
    - lookup('env', 'CLOUDFLARE_TUNNEL_ID') | default('') | length > 0
    - lookup('env', 'CLOUDFLARE_ZONE') | default('') | length > 0
  failed_when:
    - cloudflare_tunnel_configuration.status != 200
    - cloudflare_tunnel_configuration.json.success is defined and not cloudflare_tunnel_configuration.json.success

- name: Configure SSH Cloudflare tunnel published application
  uri:
    url: "https://api.cloudflare.com/client/v4/accounts/{{ cloudflare_account_id }}/cfd_tunnel/{{ cloudflare_tunnel_id }}/configurations"
    method: PUT
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      config: "{{ cloudflare_tunnel_configuration.json.result.config | combine({'ingress': cloudflare_tunnel_desired_ingress}, recursive=True) }}"
    status_code: [200, 201]
    return_content: yes
  vars:
    cloudflare_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
    cloudflare_account_id: "{{ lookup('env', 'CLOUDFLARE_ACCOUNT_ID') }}"
    cloudflare_tunnel_id: "{{ lookup('env', 'CLOUDFLARE_TUNNEL_ID') }}"
    cloudflare_tunnel_ssh_hostname: "ssh.{{ lookup('env', 'CLOUDFLARE_ZONE') }}"
    cloudflare_tunnel_existing_ingress: "{{ cloudflare_tunnel_configuration.json.result.config.ingress | default([]) }}"
    cloudflare_tunnel_host_ingress: "{{ cloudflare_tunnel_existing_ingress | selectattr('hostname', 'defined') | rejectattr('hostname', 'equalto', cloudflare_tunnel_ssh_hostname) | list }}"
    cloudflare_tunnel_fallback_ingress: "{{ cloudflare_tunnel_existing_ingress | rejectattr('hostname', 'defined') | list }}"
    cloudflare_tunnel_ssh_ingress:
      hostname: "{{ cloudflare_tunnel_ssh_hostname }}"
      service: "ssh://localhost:22"
    cloudflare_tunnel_desired_ingress: "{{ cloudflare_tunnel_host_ingress + [cloudflare_tunnel_ssh_ingress] + cloudflare_tunnel_fallback_ingress }}"
  delegate_to: localhost
  connection: local
  register: cloudflare_tunnel_ssh_configuration
  when:
    - cloudflare_tunnel_configuration is not skipped
    - cloudflare_tunnel_desired_ingress != cloudflare_tunnel_existing_ingress
  changed_when: cloudflare_tunnel_ssh_configuration.json.result.config.ingress != cloudflare_tunnel_existing_ingress
  failed_when:
    - cloudflare_tunnel_ssh_configuration.status not in [200, 201]
    - cloudflare_tunnel_ssh_configuration.json.success is defined and not cloudflare_tunnel_ssh_configuration.json.success
